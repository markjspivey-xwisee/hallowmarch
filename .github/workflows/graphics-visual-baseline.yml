name: Graphics visuals baseline comparison
on:
  push:
    branches: [diagnostic/graphics-visual-baseline-20261022]
permissions:
  contents: read
concurrency:
  group: graphics-visual-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visuals:
    name: visuals-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-c1f0483
            source: c1f048312f597f0ae4382559315de9688f43c8db
          - label: candidate-33dcfc83
            source: 33dcfc83041bc3b74de1ea578e453bdd090ed781
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use bounded Ubuntu archive downloads
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          apt_root = Path('/etc/apt')
          sources = [apt_root / 'sources.list']
          sources += list((apt_root / 'sources.list.d').glob('*.list'))
          sources += list((apt_root / 'sources.list.d').glob('*.sources'))
          sources += list(apt_root.glob('apt-mirrors*.txt'))
          azure = re.compile(r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)')
          for source in sources:
              if not source.is_file():
                  continue
              original = source.read_text()
              updated = azure.sub('https://archive.ubuntu.com/ubuntu', original)
              if updated != original:
                  source.write_text(updated)
                  print('Using the official Ubuntu archive in', source)
          (apt_root / 'apt.conf.d' / '99-hallowmarch-ci').write_text(
              'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n')
          PY
      - name: Install graphics test dependencies
        run: |
          npm ci --prefix tools
          npm ci --prefix server
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Build and lint exact source
        run: bash tools/lint.sh 80
      - name: Run identical prescribed visual collision check
        run: python3 tools/ci/run_check.py python3 tools/tests/look.py views=l7_yard,l7_cart,l7_woodcutter,l7_quarry,l7_moon,l7_dead,l7_weapons,l7_inside_storm q=low v=day tag=hallowmarch-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visuals-${{ matrix.label }}
          path: tools/out/
          retention-days: 14
