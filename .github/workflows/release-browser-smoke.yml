name: Temporary release browser smoke
on:
  push:
    branches: ['test/release-browser-smoke-20261023']
    paths:
      - '.github/workflows/release-browser-smoke.yml'
      - 'tools/manual/release-browser-smoke.mjs'
permissions:
  contents: read
concurrency:
  group: release-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deployed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use bounded Ubuntu archive downloads
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          apt_root = Path('/etc/apt')
          sources = [apt_root / 'sources.list']
          sources += list((apt_root / 'sources.list.d').glob('*.list'))
          sources += list((apt_root / 'sources.list.d').glob('*.sources'))
          sources += list(apt_root.glob('apt-mirrors*.txt'))
          azure = re.compile(r'https?://azure\.archive\.ubuntu\.com/ubuntu(?=/|\s|$)')
          for source in sources:
              if not source.is_file():
                  continue
              original = source.read_text()
              updated = azure.sub('https://archive.ubuntu.com/ubuntu', original)
              if updated != original:
                  source.write_text(updated)
                  print('Using the official Ubuntu archive in', source)
          (apt_root / 'apt.conf.d' / '99-hallowmarch-ci').write_text(
              'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n')
          PY
      - name: Install locked browser dependencies
        run: |
          npm ci --prefix tools
          node tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check script syntax
        run: node --check tools/manual/release-browser-smoke.mjs
      - name: Exercise actual deployed guest UI
        run: node tools/manual/release-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-browser-smoke-public-evidence
          path: tools/out/release-browser-smoke/
          retention-days: 7
