name: Native final queue scope proof
on:
  push:
    branches: [fix/native-final-queue-scope-20261024]
permissions:
  contents: read
jobs:
  final-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server
      - name: Build pinned native SDK proof dependencies
        env:
          INTEREGO_SDK_TEST_ROOT: ${{ runner.temp }}/native-final-queue-sdk
        run: |
          node tools/setup-native-sdk.mjs
          echo "INTEREGO_SDK_TEST_ROOT=$INTEREGO_SDK_TEST_ROOT" >> "$GITHUB_ENV"
      - name: Verify exact native final capture and human idle boundaries
        run: |
          node --test \
            tools/tests/live_play_activity.test.mjs \
            tools/tests/departing_save.test.mjs \
            tools/tests/idle_client_network.test.mjs \
            tools/tests/progressive_ui.test.mjs \
            tools/tests/human_play_gate.test.mjs \
            tools/tests/server_human_lifecycle.test.mjs \
            server/gaming/idle-persistence.test.mjs \
            server/gaming/live-only-server.test.mjs \
            server/gaming/progressive-owned-state.test.mjs \
            server/gaming/player-server.test.mjs \
            client/native-pod/native-load.test.mjs \
            client/native-pod/profile.test.mjs \
            client/native-pod/provisional-session.test.mjs
