name: Water evidence and CI diagnostic verification
on:
  push:
    branches: [feature/v20-final-qa-20261014]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnostic parser regressions
        run: python3 -m unittest discover -s tools/tests -p ci_runner_regression.py
      - name: Replay the actual clean water output
        run: python3 tools/ci/run_check.py python3 -c 'from pathlib import Path; print(Path("qa-captured-water2.txt").read_text(), end="")'
      - uses: actions/download-artifact@v4
        with:
          name: water-evidence
          path: qa
          run-id: 38606868351
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Export the captured views for inspection
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 - <<'PY'
          import pathlib, hashlib, base64, io
          from PIL import Image, ImageDraw
          files = [next(pathlib.Path("qa").rglob(n)) for n in ("water2_under.png", "water2_boat_lake.png", "water2_boat_river.png", "water2_under_ice.png")]
          assert len(files) == 4, files
          w, h = Image.open(files[0]).size
          sheet = Image.new("RGB", (w * 2, (h + 28) * 2), "#151a20")
          draw = ImageDraw.Draw(sheet)
          for i, p in enumerate(files):
              im = Image.open(p).convert("RGB")
              assert im.size == (w, h)
              x, y = (i % 2) * w, (i // 2) * (h + 28)
              sheet.paste(im, (x, y + 28))
              draw.text((x + 8, y + 7), p.stem, fill="white")
              print("source", p.name, hashlib.sha256(p.read_bytes()).hexdigest())
          b = io.BytesIO()
          sheet.save(b, format="PNG")
          print("BEGIN_QA_IMAGE")
          print(base64.b64encode(b.getvalue()).decode("ascii"))
          print("END_QA_IMAGE")
          PY
