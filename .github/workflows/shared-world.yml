name: Shared world regression
on:
  push:
    branches: [fix/shared-world-state-20261023, fix/shared-world-state-recovery-20261024]
  pull_request:
    paths: ['src/**', 'server/**', 'tools/tests/shared_world.py', 'tools/tests/warband_*.test.mjs', '.github/workflows/shared-world.yml']
permissions:
  contents: read
concurrency:
  group: shared-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          npm ci --prefix tools
          npm ci --prefix server
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Build and lint
        run: bash tools/lint.sh 100
      - name: Shared scene, ownership and checkpoint regressions
        if: ${{ !cancelled() }}
        run: |
          node --test tools/tests/combat_ground_timing.test.mjs tools/tests/class_ground_producers.test.mjs tools/tests/projectile_wall_lifetime.test.mjs tools/tests/enemy_ground_warnings.test.mjs tools/tests/death_cause_feedback.test.mjs tools/tests/pvp_ground_receipts.test.mjs tools/tests/character_start_level.test.mjs tools/tests/dot_source_attribution.test.mjs tools/tests/encounter_development.test.mjs tools/tests/town_worker_development.test.mjs tools/tests/world_development.test.mjs tools/tests/world_level_independence.test.mjs tools/tests/work_practice.test.mjs tools/tests/world_progression_review.test.mjs tools/tests/dungeon_pet_levels.test.mjs tools/tests/client_release_compatibility.test.mjs
          node --test server/shared-scene.test.mjs server/warband-orders.test.mjs server/thrones.test.mjs tools/tests/throne_control.test.mjs tools/tests/throne_rts.test.mjs tools/tests/throne_rts_construction.test.mjs tools/tests/throne_rts_workforce.test.mjs tools/tests/throne_rts_render.test.mjs tools/tests/realm_management.test.mjs tools/tests/realm_diplomacy.test.mjs tools/tests/season_field.test.mjs tools/tests/realm_protocol.test.mjs tools/tests/realm_war_hooks.test.mjs tools/tests/realm_public_works.test.mjs tools/tests/realm_logistics.test.mjs tools/tests/realm_logistics_client.test.mjs tools/tests/realm_logistics_network.test.mjs server/gaming/hallowmarch-world-state.test.mjs server/gaming/progressive-owned-state.test.mjs
          node --test tools/shared-resource-jobs.test.mjs tools/shared-hatch-ownership.test.mjs tools/tests/net_animals_client.mjs tools/tests/shared_combat_fields.mjs tools/tests/shared_world_tls.test.mjs tools/tests/net_boats_client.mjs tools/net-npcs.test.mjs tools/tests/shared_entities.mjs tools/tests/net_worldparts.mjs tools/tests/net_dungeons.mjs tools/tests/shared_world_proximity.mjs tools/tests/shared_dungeon_handoff.mjs tools/tests/shared_dungeon_fall.mjs
          node --test tools/tests/net_reconnect.mjs tools/tests/net_world_pause.mjs tools/tests/server_human_lifecycle.test.mjs
          node --test tools/tests/shared_scene_protocol.mjs
          node --test tools/tests/towerfire_snapshot.test.mjs tools/tests/tower_brand_shared.test.mjs
          node --test tools/tests/warband_campaign_repair.test.mjs tools/tests/warband_replication.test.mjs tools/tests/warband_orders_shared.test.mjs
      - name: Actual WebSocket clients
        if: ${{ !cancelled() }}
        run: node tools/tests/shared_scene_transport.mjs
      - name: Independent phone and desktop worlds
        if: ${{ !cancelled() }}
        run: python tools/tests/shared_world.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-world-evidence
          path: tools/out/
          retention-days: 7
