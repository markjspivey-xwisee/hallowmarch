name: Temporary native authority readiness
on:
  push:
    branches: [test/native-readiness-20261024]
    paths: ['.github/workflows/native-readiness.yml']
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read bounded public authority diagnostics
        run: |
          node --input-type=module <<'JS'
          for (const [label, origin] of [['preview','https://march-native-preview-production.up.railway.app'],['production','https://march-production-f6d9.up.railway.app']]) {
            const response = await fetch(origin + '/gaming/status', {signal: AbortSignal.timeout(20000)});
            const state = await response.json(), world = state.manifest?.worldAuthority || {}, store = state.nativeStore || {};
            const summary = Object.fromEntries(Object.entries(store).filter(([key, value]) =>
              typeof value === 'number' || typeof value === 'boolean'
              || ['mode','state','status','error','lastErrorCode'].includes(key) && typeof value === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(value)));
            console.log('HM_NATIVE_READINESS ' + JSON.stringify({label, http:response.status,
              identity:state.playerIdentity, nativeStore:summary, capacityBytes:store.capacityBytes, lastCommitSize:store.lastCommitSize, lastCommitSizeFailure:store.lastCommitSizeFailure, nativeStoreFields:Object.keys(store),
              world:Object.fromEntries(['mode','state','fenced','error','version','confirmedVersion','liveVersion','confirmedLiveVersion','pending','durable'].filter(k=>world[k]!==undefined).map(k=>[k,world[k]]))}));
          }
          const relayResponse = await fetch('https://relay.interego.xwisee.com/health', {signal: AbortSignal.timeout(15000)});
          const relay = await relayResponse.json();
          const revisions = [];
          const scan = value => { if (typeof value === 'string' && /^[a-f0-9]{7,40}$/.test(value)) revisions.push(value);
            else if (value && typeof value === 'object') Object.values(value).forEach(scan); };
          scan(relay);
          console.log('HM_RELAY_REVISIONS ' + JSON.stringify({ http: relayResponse.status, revisions }));
          JS
      - name: Read safe prior two-player acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const r=await fetch('https://api.github.com/repos/markjspivey-xwisee/hallowmarch/actions/artifacts/12550870754/zip',
            {headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},redirect:'manual'});
          if(r.status!==302)throw Error('artifact_redirect_unavailable');
          const url=new URL(r.headers.get('location'));
          if(!url.hostname.endsWith('.blob.core.windows.net')&&!url.hostname.endsWith('.githubusercontent.com'))throw Error('unexpected_artifact_host');
          const zip=await fetch(url,{signal:AbortSignal.timeout(30000)});
          if(!zip.ok)throw Error('artifact_download_failed');
          await fs.writeFile('native-qa-safe.zip',new Uint8Array(await zip.arrayBuffer()));
          JS
          python3 - <<'PY'
          import zipfile,json
          with zipfile.ZipFile('native-qa-safe.zip') as z:
              name=next(n for n in z.namelist() if n.endswith('result.json'))
              data=json.loads(z.read(name))
          allowed=['ok','failure','pageErrorCount','consoleErrorCount','diagnostics','finalHealth','cases']
          print('HM_NATIVE_QA_SAFE_RESULT '+json.dumps({k:data[k] for k in allowed if k in data}))
          PY
