name: Verify water at every body height
on:
  push:
    branches: [feature/v20-body-water-20261014]
permissions:
  contents: read
jobs:
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix tools
          python3 -m pip install playwright==1.55.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - run: bash tools/lint.sh 80
      - run: python3 tools/ci/run_check.py python3 tools/tests/water.py
