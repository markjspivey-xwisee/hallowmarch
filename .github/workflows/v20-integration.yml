name: Version 20 integrated verification

on:
  push:
    branches: [feature/v20-integration-20261014]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v20-integration
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Combine the saved work without touching main
        run: |
          git config user.name "Hallowmarch verification"
          git config user.email "hallowmarch-ci@users.noreply.github.com"
          for ref in 6032c70c385245dbdd1a9530a357b8895e57164b d9539934d435d642f34bc3f338dc050a1da91ad9 20a7b35669e8bbe17bb8806d1b4eb1e3e062e713 364a714ef09c8494045c2185ca668053beafcef2; do
            if ! git merge --no-edit --no-ff "$ref"; then
              if ! python3 tools/ci/merge_saved.py; then
                git diff --name-only --diff-filter=U
                git diff --cc
                exit 1
              fi
            fi
          done
      - name: Save assembled work in progress
        id: save
        run: |
          git push origin HEAD:refs/heads/feature/v20-integration-20261014
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Keep conflict evidence
        if: ${{ failure() }}
        run: git diff --cc > merge-conflicts.txt
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: v20-merge-conflicts
          path: merge-conflicts.txt
          retention-days: 14

  checks:
    needs: assemble
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        check: [headless, companies, season, performance, visuals, shaders, phone, soak, water]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci --prefix tools
          npm ci --prefix server
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Build and lint
        run: bash tools/lint.sh 80
      - name: Run check
        env:
          CHECK: ${{ matrix.check }}
        run: |
          check() { python tools/ci/run_check.py "$@"; }
          case "$CHECK" in
            headless)
              node --test tools/tests/companies_regression.mjs tools/tests/fieldarmies_regression.mjs
              node tools/tests/net_companies.mjs
              node tools/tests/wasm_lp.js n=4000 seed=1 time
              node tools/tests/loops_season.js seeds=12 json=tools/out/season2.json
              ;;
            companies) check python3 tools/tests/net.py companies ;;
            season) check python3 tools/tests/season2.py ;;
            performance)
              check python3 tools/tests/perf3.py only=wasm,net tag=v20-integrated
              check python3 tools/tests/net.py weather
              check python3 tools/tests/perf.py low medium render budget tag=v20-integrated
              check python3 tools/tests/perf2.py long minutes=60 tag=v20-integrated
              ;;
            visuals) check python3 tools/tests/look.py views=l7_yard,l7_cart,l7_woodcutter,l7_quarry,l7_moon,l7_dead,l7_weapons,l7_inside_storm q=low v=day tag=v20-integrated ;;
            shaders) check python3 tools/tests/shaders.py ;;
            phone)
              check python3 tools/tests/phone.py
              check python3 tools/tests/touch_flows.py only=net,stores,season
              ;;
            soak) check python3 tools/soak.py 10 ;;
            water)
              check python3 tools/tests/water.py
              check python3 tools/tests/water2.py
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v20-integrated-${{ matrix.check }}-evidence
          path: |
            tools/out/
            hallowmarch.html
          retention-days: 14
